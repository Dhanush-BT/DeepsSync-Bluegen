spring.application.name=DEEPSYNC-APP

spring.datasource.url=jdbc:postgresql://localhost:5433/deepsync
spring.datasource.username=deepsync
spring.datasource.password=deepsync

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Seeded first admin account (breaks the auth bootstrap problem - see docs/CLAUDE.md).
# Override these via env vars in real deployments, never commit real credentials.
deepsync.admin.email=admin@deepsync.local
deepsync.admin.password=ChangeMe123!
deepsync.admin.full-name=DEEPSYNC Admin
server.port=8081

# Ocean data files (NetCDF/CSV) routinely exceed Spring's 1MB/10MB defaults.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
